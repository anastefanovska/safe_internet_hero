name: Deploy Web

# Builds the Flutter web app and deploys it to Firebase Hosting
# every time master is updated.
on:
  push:
    branches: [master]
  # Also lets you trigger it by hand from the Actions tab.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Uses --profile: the --release (minified) web build was rendering a
      # blank page in the browser, while the profile build works reliably.
      - name: Build web
        run: flutter build web --profile

      # Deploys with a CI token tied to your own Firebase account (created via
      # `firebase login:ci`). This needs no service account / IAM-admin rights.
      - name: Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project safe-internet-hero --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
